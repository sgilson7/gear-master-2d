[workspace]
resolver = "2"
# `crates/lab` is the authoring bench and is not shipped: `crates/wasm`
# does not depend on it, so nothing it does can reach a player.
members = ["crates/core", "crates/wasm", "crates/lab"]

[workspace.package]
edition = "2021"
rust-version = "1.83"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort": that compiles panics down to a bare
# `unreachable`, so a failure surfaces in the browser as "Unreachable code
# should not be executed" with no indication of what broke.

# Test binaries carry line tables and nothing else. Inherited from upstream,
# where full debuginfo across the test suite grew target/debug/deps past six
# gigabytes and turned a twenty-second suite into a ten-minute one.
#
#     CARGO_PROFILE_TEST_DEBUG=2 cargo test -p gm2d-core --test <name>
#
# gets the full backtrace back for one run without editing anything.
[profile.test]
debug = "line-tables-only"
# **And optimised, because the suite's cost is runtime and not build.**
# `debug = "line-tables-only"` above fixed the *other* half of this in the
# fork: full debuginfo across the suite grew `target/debug/deps` past six
# gigabytes. What was left is that a test binary ran at `opt-level = 0`, and
# this suite simulates a very great deal of combat — `drops.rs` alone draws
# pools and counts wins for sixty-five seconds, which was more than the other
# fifty-seven files put together.
#
# `debug_assertions` and overflow checks stay on, because this is the `test`
# profile and not `--release`: what is bought is speed, and nothing is given
# up. A cold build costs a little more and every run after it costs much less.
opt-level = 2

# Dependencies too, or the engine is optimised and the crates it leans on are
# not. They change about once a year, so this is paid once.
[profile.test.package."*"]
opt-level = 2
