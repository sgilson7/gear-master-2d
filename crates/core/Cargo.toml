[package]
name = "gm2d-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# This crate must never depend on wasm-bindgen, web-sys, or any rendering
# library. Keeping it graphics-free and wasm-free is what makes every rule
# testable with `cargo test -p gm2d-core` in a few seconds.
#
# Upstream had an empty [dependencies] and said so proudly. serde is the one
# deliberate break: the save file is the MVP's hard gate, and hand-rolling
# JSON for a hundred-field state is how you get a save that silently loses a
# field. See PLAN.md 1.3.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
