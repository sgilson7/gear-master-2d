[package]
name = "gm2d-lab"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# **Not shipped, and it must not be.** The lab is the authoring bench: it
# searches the catalogue for a loadout that hits a rating, and it prints an
# existing creature's board so somebody can read it. Neither is part of the
# game, and `crates/wasm` does not depend on it.
[[bin]]
name = "dress"
path = "src/dress.rs"

# **The fixture generator, and it is here for the reason `dress` is.** The run
# this block is bracketed against did not arrive as a file; `PLAN-M16.md` §5.1
# transcribes it, and this writes that transcription out as a save. Authoring
# bench, not game.
[[bin]]
name = "mkrun"
path = "src/mkrun.rs"

[dependencies]
gm2d-core = { path = "../core" }

[[bin]]
name = "probe"
path = "src/probe.rs"
